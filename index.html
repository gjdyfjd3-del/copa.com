<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اليوم الوطني 96</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .page-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 100vh;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .warning-stripe {
            height: 22px;
            width: 100%;
            flex-shrink: 0;
            background-image: repeating-linear-gradient(
                45deg,
                #000000,
                #000000 20px,
                #FFCC00 20px,
                #FFCC00 40px
            );
            border-top: 2px solid #000;
            border-bottom: 2px solid #000;
        }
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            text-align: center;
        }
        .alert-icon-container {
            width: 75px;
            height: 75px;
            border: 4px solid #d9534f;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
            background-color: #fff;
            flex-shrink: 0;
        }
        .alert-exclamation {
            font-size: 45px;
            color: #d9534f;
            font-weight: bold;
            line-height: 1;
        }
        h1 {
            font-size: 24px;
            color: #222;
            margin-bottom: 8px;
            font-weight: bold;
        }
        p {
            font-size: 14px;
            line-height: 1.5;
            color: #333;
            max-width: 380px;
            margin-bottom: 15px;
        }
        .action-btn {
            background-color: #d9534f;
            color: #ffffff;
            border: 2px solid #000;
            padding: 10px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            transition: 0.2s;
        }
        .action-btn:hover {
            background-color: #c9302c;
        }
        .footer-section {
            padding: 10px;
            text-align: center;
            flex-shrink: 0;
        }
        .hashtag {
            font-size: 18px;
            font-weight: bold;
            color: #111;
            margin-bottom: 2px;
        }
        .signature {
            font-size: 12px;
            color: #666;
        }

        /* نافذة عرض الصورة المنبثقة (Modal) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.92);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 15px;
        }
        
        /* حاوية الصورة وحدها لتظهر بالكامل */
        .image-container {
            max-width: 90%;
            max-height: 60vh;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            max-width: 100%;
            max-height: 60vh;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
            object-fit: contain;
        }

        /* الشريط التوعوي المنفصل في الأسفل */
        .bottom-banner {
            max-width: 90%;
            background-color: #d9534f;
            color: #ffffff;
            padding: 10px 15px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            line-height: 1.4;
            border-radius: 6px;
            border: 2px solid #000;
            margin-bottom: 12px;
        }

        .close-btn {
            background-color: #333;
            color: white;
            border: 2px solid #fff;
            padding: 8px 22px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="page-container">
        <!-- الشريط التحذيري العلوي -->
        <div class="warning-stripe"></div>

        <!-- المحتوى الرئيسي -->
        <div class="content">
            <div class="alert-icon-container">
                <div class="alert-exclamation">!</div>
            </div>
            
            <h1>تحذير</h1>
            
            <p>تعرف إن دخولك لروابط مشبوهة قد تعرض نفسك ومن تحب للخطر؟<br>تحقق من الرابط قبل دخوله</p>
            
            <!-- زر اضغط هنا باللون الأحمر -->
            <button class="action-btn" onclick="handleAction(event)">اضغط هنا</button>
        </div>

        <!-- التذييل (الهاشتاق والاسم) -->
        <div class="footer-section">
            <div class="hashtag">#حملة_كلنا_وعي</div>
            <div class="signature">مشاري القرشي</div>
        </div>

        <!-- الشريط التحذيري السفلي -->
        <div class="warning-stripe"></div>
    </div>

    <!-- نافذة عرض المنشور مع الشريط في الأسفل -->
    <div id="posterModal" class="modal">
        <div class="image-container">
            <img src="poster.jpeg" alt="المنشور التوعوي" class="modal-content">
        </div>
        
        <!-- الشريط الأحمر المنفصل في آخر الصفحة -->
        <div class="bottom-banner">
            مشت عليك؟ خذ لقطة للشاشة وشاركها بحسابك بتويتر عشان ماتمشي على غيرك!
        </div>

        <button class="close-btn" onclick="closePoster()">إغلاق</button>
    </div>

    <!-- عنصر الصوت المخفي بصيغة alarm.m4a -->
    <audio id="sirenAudio" preload="auto">
        <source src="alarm.m4a" type="audio/mp4">
    </audio>

    <script>
        const sirenAudio = document.getElementById('sirenAudio');

        function triggerAlertEffects() {
            if (sirenAudio) {
                sirenAudio.currentTime = 0;
                sirenAudio.volume = 1.0;
                sirenAudio.play().catch(error => {
                    console.log("الصوت بانتظار التفاعل");
                });
            }
        }

        function handleAction(event) {
            event.stopPropagation();
            triggerAlertEffects(); // تشغيل الإنذار الصوتي
            document.getElementById('posterModal').style.display = 'flex'; // إظهار النافذة
        }

        function closePoster() {
            document.getElementById('posterModal').style.display = 'none';
        }
    </script>

</body>
</html>
