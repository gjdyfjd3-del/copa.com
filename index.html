<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحذير أمني - حملة كلنا وعي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
        }
        .page-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 100vh;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .warning-stripe {
            height: 22px;
            width: 100%;
            flex-shrink: 0;
            background-image: repeating-linear-gradient(
                45deg,
                #000000,
                #000000 20px,
                #FFCC00 20px,
                #FFCC00 40px
            );
            border-top: 2px solid #000;
            border-bottom: 2px solid #000;
        }
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            text-align: center;
        }
        .alert-icon-container {
            width: 75px;
            height: 75px;
            border: 4px solid #d9534f;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
            background-color: #fff;
            flex-shrink: 0;
        }
        .alert-exclamation {
            font-size: 45px;
            color: #d9534f;
            font-weight: bold;
            line-height: 1;
        }
        h1 {
            font-size: 24px;
            color: #222;
            margin-bottom: 8px;
            font-weight: bold;
        }
        p {
            font-size: 14px;
            line-height: 1.5;
            color: #333;
            max-width: 380px;
        }
        .footer-section {
            padding: 10px;
            text-align: center;
            flex-shrink: 0;
        }
        .hashtag {
            font-size: 18px;
            font-weight: bold;
            color: #111;
            margin-bottom: 2px;
        }
        .signature {
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="page-container">
        <!-- الشريط التحذيري العلوي -->
        <div class="warning-stripe"></div>

        <!-- المحتوى الرئيسي -->
        <div class="content">
            <div class="alert-icon-container">
                <div class="alert-exclamation">!</div>
            </div>
            
            <h1>تحذير</h1>
            
            <p>تعرف إن دخولك لروابط مشبوهة قد تعرض نفسك ومن تحب للخطر؟<br>تحقق من الرابط قبل دخوله</p>
        </div>

        <!-- التذييل (الهاشتاق والاسم) -->
        <div class="footer-section">
            <div class="hashtag">#حملة_كلنا_وعي</div>
            <div class="signature">مشاري القرشي</div>
        </div>

        <!-- الشريط التحذيري السفلي -->
        <div class="warning-stripe"></div>
    </div>

    <!-- عنصر الصوت المخفي بصيغة alarm.m4a -->
    <audio id="sirenAudio" preload="auto">
        <source src="alarm.m4a" type="audio/mp4">
    </audio>

    <script>
        const sirenAudio = document.getElementById('sirenAudio');

        function triggerAlertEffects() {
            if (sirenAudio) {
                sirenAudio.currentTime = 0;
                sirenAudio.volume = 1.0;
                sirenAudio.play().catch(error => {
                    console.log("الصوت بانتظار التفاعل");
                });
            }
        }

        document.addEventListener("click", function() {
            triggerAlertEffects();
        }, { once: true });

        document.addEventListener("touchstart", function() {
            triggerAlertEffects();
        }, { once: true });
    </script>

</body>
</html>
